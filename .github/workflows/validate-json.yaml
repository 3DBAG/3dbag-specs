name: Validate specifications

on:
  push:
    paths:
      - 'resources/*.json'
      - 'resources/**/*.json'
    branches:
      - '**'
  pull_request:
    paths:
      - 'resources/*.json'
      - 'resources/**/*.json'
    branches:
      - '**'
  workflow_dispatch:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    name: Validate specifications

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install package
        run: uv sync

      - name: Validate JSON
        run: |
          for document in resources/semantic/attributes.json resources/projections/{cityjson,gpkg,ogc3dtiles}.json; do
            uv run validate-specs-json --schema "${document%.json}.schema.json" --json "$document"
          done
          uv run validate-specs-bundle resources/attribute-specification.json
